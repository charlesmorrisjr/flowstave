<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flowstave sight-reading</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="apple-mobile-web-app-title" content="Flowstave"><meta name="theme-color" content="#111113">
<style>
/* VOICE: a calm practice instrument; nothing competes with the music
   IDEA: the music rest of a digital piano holding an endless engraved sheet
   PICTURE: two grand staves on white paper, a blue cursor, notes turning green or red
   COLOUR and TYPE: lacquer black housing, white paper, cursor blue, grade green/red; Instrument Sans
   LAYOUT: control strip, paper with two systems, keyboard on the housing below */
:root{color-scheme:dark;--bg:#111113;--panel:#1a1a1e;--line:#2d2d34;--ink:#f3f3f5;--mute:#a0a0ab;--paper:#fff;--engr:#17171b;--good:#169b47;--bad:#e0342b;--cur:#2f6bff}
*{box-sizing:border-box;min-width:0}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;overflow-x:clip;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button,select{font:inherit;color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding:14px max(2vw,10px) 24px}
.bar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;padding:6px 2px 12px}
.brand{font-weight:700;font-size:18px;letter-spacing:-.01em;margin-right:6px}
.grp{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lvl{display:flex;align-items:center;gap:6px}
.lvl b{font-size:22px;font-weight:700;min-width:92px;text-align:center;white-space:nowrap}
.lvl small{display:block;color:var(--mute);font-size:13px;font-weight:500;text-align:center}
.ib{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:18px}
.ib:hover,.seg button:hover,.btn:hover{border-color:#55555f}
.seg{display:flex;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:0 14px;height:40px;cursor:pointer;color:var(--mute);font-weight:600}
.seg button[aria-pressed=true]{background:var(--ink);color:#111}
.btn{height:40px;padding:0 18px;border-radius:11px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:600;white-space:nowrap}
.btn.go{background:var(--cur);border-color:var(--cur);color:#fff}
.bpm{display:flex;align-items:center;gap:4px}.bpm span{min-width:74px;text-align:center;font-weight:600;white-space:nowrap}
.stats{display:flex;gap:18px;align-items:center}
.stat{line-height:1.1}.stat small{display:block;color:var(--mute);font-size:13px}
.stat b{font-size:26px;font-variant-numeric:tabular-nums;font-weight:700}
.dots{display:flex;gap:6px;margin-top:6px}.dots i{width:13px;height:13px;border-radius:50%;border:2px solid #5a5a64}.dots i.on{background:var(--good);border-color:var(--good)}
:focus-visible{outline:2px solid var(--cur);outline-offset:2px}
.paper{position:relative;background:var(--paper);border-radius:14px;padding:10px 8px;box-shadow:0 18px 40px -18px #000,0 0 0 1px #00000010;overflow-x:auto}
.sys{min-width:760px}
.sys svg{display:block;width:100%;height:auto;fill:var(--engr)}
.sys+.sys{margin-top:-6px}
.sl{stroke:#26262b;stroke-width:1}.stem,.lg,.bl{stroke:var(--engr)}.stem{stroke-width:1.3}.lg{stroke-width:1.4}.bl{stroke-width:1.2}
.good{fill:var(--good)}.bad{fill:var(--bad)}
.cur{fill:var(--cur);opacity:.16}.cur.tempo{opacity:.22}
.fresh{animation:fresh .45s ease-out}
@keyframes fresh{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.fresh{animation:none}}
.toast{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0;transition:opacity .25s}
.toast.show{opacity:1}
.toast div{background:#111113f0;color:#fff;padding:22px 34px;border-radius:16px;text-align:center;box-shadow:0 20px 50px -10px #0008}
.toast b{display:block;font-size:40px;line-height:1.05;letter-spacing:-.02em}.toast span{color:#c9c9d2}
.opts{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;color:var(--mute);font-size:14px;padding:12px 2px 4px}
.opts label{display:flex;align-items:center;gap:6px;cursor:pointer;min-height:32px}
.opts input{width:18px;height:18px;accent-color:var(--cur)}
.opts select{background:var(--panel);border:1px solid var(--line);border-radius:8px;height:34px;padding:0 8px;font-size:14px}
.status{margin-left:auto;display:flex;gap:10px;align-items:center}
.status em{font-style:normal;color:var(--ink)}
.kb{position:relative;height:118px;margin-top:10px;display:flex;user-select:none;touch-action:none;border-top:4px solid #8f1d22;border-radius:4px;overflow:hidden}
.kb .w{flex:1;background:linear-gradient(#f4f4f4,#fff 70%,#e6e6e6);border-right:1px solid #9a9a9a;border-radius:0 0 5px 5px;position:relative;cursor:pointer}
.kb .w span{position:absolute;bottom:6px;left:0;right:0;text-align:center;color:#888;font-size:11px}
.kb .k{position:absolute;top:0;height:62%;background:linear-gradient(#2a2a2e,#0b0b0c);border-radius:0 0 4px 4px;z-index:2;cursor:pointer;box-shadow:inset 0 -4px 0 #000}
.kb .on{background:#9db8ff!important}.kb .g{background:#6fd394!important}.kb .r{background:#f08a84!important}
.hint{color:var(--mute);font-size:13px;margin-top:8px}
.hint kbd{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:0 5px}
@media(max-width:600px){.lvl b{font-size:19px;min-width:76px}.stat b{font-size:22px}.status{margin-left:0}.kb{height:96px}}
</style></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="defs"></defs></svg>
<script>
(function(){
  function report(msg){
    try{var el=document.getElementById('midiStat');if(el){el.textContent='Error: '+msg;el.style.color='#ff8a80'}}catch(e){}
    try{var x=new XMLHttpRequest();x.open('POST','/client-log',true);x.setRequestHeader('Content-Type','text/plain');x.send(String(msg).slice(0,1500))}catch(e){}
  }
  window.__fsReport=report;
  // Ignore errors that aren't from this page's own code: browser extensions and built-in features

  var seen={};

  window.onerror=function(m,src,line,col,err){if(!ours(String(m),src,line))return;var k=m+line;if(seen[k])return;seen[k]=1;report(m+' (line '+line+':'+col+')'+(err&&err.stack?' | '+String(err.stack).split('\n').slice(0,3).join(' / '):''));};

})();
</script>
<div class="wrap">
 <div class="bar">
  <div class="grp">
   <span class="brand">Flowstave</span>
   <div class="lvl"><button class="ib" id="lvDown" aria-label="Previous level">‹</button><div><b id="lvNum">Level 1</b><small id="lvTitle"></small></div><button class="ib" id="lvUp" aria-label="Next level">›</button></div>
  </div>
  <div class="stats">

   <div class="stat"><small>95%+ staves to level up</small><div class="dots"><i id="d0"></i><i id="d1"></i></div></div>
  </div>
  <div class="grp">
   <div class="seg" role="group" aria-label="Mode"><button id="mWait">Wait for me</button><button id="mTempo">Tempo</button></div>
   <div class="bpm" id="bpmBox"><button class="ib" id="bpmDown" aria-label="Slower">−</button><span id="bpm">60 BPM</span><button class="ib" id="bpmUp" aria-label="Faster">+</button></div>
   <button class="btn go" id="go">Start</button>
  </div>
 </div>
 <div class="paper" id="paper">
  <div class="sys"><svg id="s0" viewBox="0 0 1100 262"></svg></div>
  <div class="sys"><svg id="s1" viewBox="0 0 1100 262"></svg></div>
  <div class="toast" id="toast"><div><b id="tB"></b><span id="tS"></span></div></div>
 </div>
 <div class="opts">
  <label><input type="checkbox" id="oMetro"> Metronome</label>
  <label><input type="checkbox" id="oSound"> Sound for on-screen and computer keys</label>
  <label><input type="checkbox" id="oMidiSound"> Sound for MIDI keyboard</label>
  <label>Timing <select id="oTol"><option value="relaxed">Relaxed</option><option value="normal">Normal</option><option value="strict">Strict</option></select></label>
  <label id="wakeBox"><input type="checkbox" id="oWake"> Keep screen awake</label><span id="wakeTip" hidden>Tip: set the iPad's Auto-Lock to Never while you practise.</span>
  <div class="status"><span id="midiStat">Connecting to the Flowstave server…</span></div>
 </div>
 <div class="kb" id="kb"></div>
 <div class="hint" id="hint"></div>
</div>

$('lvDown').onclick=()=>setLevel(st.level-1);$('lvUp').onclick=()=>setLevel(st.level+1);
const setMode=m=>{st.mode=m;save();hint();newSession()};$('mWait').onclick=()=>setMode('wait');$('mTempo').onclick=()=>setMode('tempo');
const bump=d=>{st.bpm=Math.max(30,Math.min(180,st.bpm+d));save();if(st.running)newSession();hud()};$('bpmDown').onclick=()=>bump(-4);$('bpmUp').onclick=()=>bump(4);
$('go').onclick=()=>{ensureAudio();if(st.mode=='wait'||st.running)newSession();else startTempo()};
for(const[id,k]of[['oMetro','metro'],['oSound','sound'],['oMidiSound','midiSound']]){$(id).checked=st[k];$(id).onchange=e=>{st[k]=e.target.checked;save()}}
$('oTol').value=st.tol;$('oTol').onchange=e=>{st.tol=e.target.value;save()};
window.__fs={st,net,noteOn,genLine,renderLine,newSession,startTempo};
connect(); // connect first, so a drawing problem can't stop the MIDI connection
try{hint();newSession()}catch(e){window.__fsReport&&window.__fsReport('Drawing failed: '+e.message+' | '+String(e.stack||'').split('\n').slice(0,3).join(' / '));}
window.__fsStarted=true;
})();
</script>
</body></html>
